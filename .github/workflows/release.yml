name: Regenerate and release

on:
  repository_dispatch:
    types: [ core-spec-updated ]
  workflow_dispatch:
    inputs:
      core_ref:
        description: "eliferpg-core ref/SHA to generate against (defaults to main)"
        required: false
        default: main

permissions:
  contents: write
  packages: write

env:
  OASDIFF_VERSION: "1.29.1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend-api-client-dotnet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Save old spec
        run: cp eliferpg-core/openapi/eliferpg-api-v1.json old-spec.json

      - name: Update eliferpg-core submodule to target ref
        run: |
          set -euo pipefail
          target_ref="${{ github.event.client_payload.sha || github.event.inputs.core_ref || 'main' }}"
          git -C eliferpg-core fetch --depth 1 origin "${target_ref}"
          git -C eliferpg-core checkout FETCH_HEAD

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install oasdiff
        run: |
          curl -sSL -o oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          tar -xzf oasdiff.tar.gz oasdiff
          chmod +x oasdiff
          sudo mv oasdiff /usr/local/bin/oasdiff
          oasdiff --version

      - name: Restore kiota tool
        run: dotnet tool restore

      - name: Classify spec change
        id: classify
        run: |
          set -euo pipefail
          new_spec="eliferpg-core/openapi/eliferpg-api-v1.json"
          old_spec="old-spec.json"

          diff_json="$(oasdiff diff "$old_spec" "$new_spec" -f json)"
          if [[ "$diff_json" == "{}" ]]; then
            echo "No spec changes detected — skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          breaking_json="$(oasdiff breaking "$old_spec" "$new_spec" -f json)"
          if [[ "$breaking_json" != "[]" ]]; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          else
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          oasdiff changelog "$old_spec" "$new_spec" > changelog.txt || true

      - name: Compute next version
        id: version
        if: steps.classify.outputs.skip != 'true'
        run: |
          set -euo pipefail
          bump="${{ steps.classify.outputs.bump }}"

          latest_tag="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          latest="${latest_tag#v}"
          latest="${latest:-0.0.0}"
          IFS='.' read -r major minor patch <<< "$latest"

          if [[ "$bump" == "major" ]]; then
            next="$((major + 1)).0.0"
          else
            next="${major}.$((minor + 1)).0"
          fi

          echo "version=${next}" >> "$GITHUB_OUTPUT"

      - name: Generate client
        if: steps.classify.outputs.skip != 'true'
        run: bash scripts/generate-client.sh --openapi eliferpg-core/openapi/eliferpg-api-v1.json

      - name: Commit and tag
        if: steps.classify.outputs.skip != 'true'
        env:
          BUMP: ${{ steps.classify.outputs.bump }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ "$BUMP" == "major" ]]; then
            subject="feat!: regenerate client for breaking Central API changes"
          else
            subject="feat: regenerate client for additive Central API changes"
          fi

          {
            echo "$subject"
            echo
            if [[ -f changelog.txt ]]; then
              cat changelog.txt
            fi
          } > commit-message.txt

          git add eliferpg-core src/ELifeRPG.BackendApiClient/Generated
          git commit -F commit-message.txt
          git tag "v${VERSION}"
          git push origin main
          git push origin "v${VERSION}"

      - name: Pack
        if: steps.classify.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack src/ELifeRPG.BackendApiClient/ELifeRPG.BackendApiClient.csproj \
            --configuration Release \
            -p:Version="${VERSION}" \
            --output artifacts

      - name: Publish to GitHub Packages
        if: steps.classify.outputs.skip != 'true'
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/ELifeRPG/index.json" \
            --skip-duplicate

      - name: Create GitHub Release
        if: steps.classify.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes_file="changelog.txt"
          if [[ ! -s "$notes_file" ]]; then
            echo "No changelog available." > "$notes_file"
          fi
          gh release create "v${VERSION}" artifacts/*.nupkg \
            --title "v${VERSION}" \
            --notes-file "$notes_file"
